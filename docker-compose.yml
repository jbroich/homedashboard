services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ghcr.io/jbroich/homedashboard-backend:latest
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      SERVER_PORT: "${SERVER_PORT:?Set SERVER_PORT in .env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}"
      MQTT_ENABLED: "${MQTT_ENABLED:?Set MQTT_ENABLED in .env}"
      MQTT_BROKER_URL: "${MQTT_BROKER_URL:?Set MQTT_BROKER_URL in .env}"
      MQTT_TOPIC: "${MQTT_TOPIC:?Set MQTT_TOPIC in .env}"
      MQTT_CLIENT_ID: "${MQTT_CLIENT_ID:?Set MQTT_CLIENT_ID in .env}"
    depends_on:
      - postgres
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:?Set SERVER_PORT in .env}:${SERVER_PORT:?Set SERVER_PORT in .env}"

  frontend:
    image: ghcr.io/jbroich/homedashboard-frontend:latest
    environment:
      BACKEND_PORT: "${SERVER_PORT:?Set SERVER_PORT in .env}"
      API_BASE_URL: "${FRONTEND_API_BASE_URL:-}"
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
