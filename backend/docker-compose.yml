services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ghcr.io/jbroich/homedashboard-backend:latest
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}"
      SERVER_PORT: "${SERVER_PORT:?Set SERVER_PORT in backend/.env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in backend/.env}"
      MQTT_ENABLED: "${MQTT_ENABLED:?Set MQTT_ENABLED in backend/.env}"
      MQTT_BROKER_URL: "${MQTT_BROKER_URL:?Set MQTT_BROKER_URL in backend/.env}"
      MQTT_TOPIC: "${MQTT_TOPIC:?Set MQTT_TOPIC in backend/.env}"
      MQTT_CLIENT_ID: "${MQTT_CLIENT_ID:?Set MQTT_CLIENT_ID in backend/.env}"
    depends_on:
      - postgres
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:?Set SERVER_PORT in backend/.env}:${SERVER_PORT:?Set SERVER_PORT in backend/.env}"

volumes:
  pgdata:
