spring.application.name=homedashboard

# --- Server ---
server.port=8081

# --- Frontend ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://127.0.0.1:19006}

# --- Datasource (defaults for local dev) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/roomclimate
spring.datasource.username=roomclimate
spring.datasource.password=roomclimate

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- SQL init (optional for data.sql) ---
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

mqtt.enabled=${MQTT_ENABLED:false}
mqtt.brokerUrl=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.topic=${MQTT_TOPIC:zigbee2mqtt/+}
# Local defaults keep MQTT disabled unless explicitly configured.
mqtt.clientId=${MQTT_CLIENT_ID:homedashboard-backend-local}
