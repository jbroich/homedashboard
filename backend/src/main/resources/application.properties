spring.application.name=homedashboard

# --- Server ---
server.port=8081

# --- Frontend ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://127.0.0.1:19006}

# --- Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Database migrations ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.sql.init.mode=never

mqtt.enabled=${MQTT_ENABLED:false}
mqtt.brokerUrl=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.topic=${MQTT_TOPIC:zigbee2mqtt/+}
# Local defaults keep MQTT disabled unless explicitly configured.
mqtt.clientId=${MQTT_CLIENT_ID:homedashboard-backend-local}
