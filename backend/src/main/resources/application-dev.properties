# Local development profile. These values are safe, local-only credentials for
# docker-compose.local.yml and must never be reused for deployment.
spring.datasource.url=jdbc:postgresql://localhost:15432/homedashboard_local
spring.datasource.username=homedashboard_local
spring.datasource.password=homedashboard-local-password

spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/dev-seed.sql

mqtt.enabled=false
